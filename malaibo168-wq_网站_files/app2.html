<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>闲鱼 - 详情</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, Microsoft Yahei, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f7f7f7;
            color: #222;
            display: flex;
            justify-content: center;
        }

        .app-shell {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: #f7f7f7;
            padding-bottom: 70px;
            position: relative;
        }

        /* 顶栏 */
        .app-header {
            position: sticky;
            top: 0;
            background: #fff;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            border-bottom: 1px solid #f0f0f0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-icon {
            font-size: 20px;
            font-weight: bold;
            color: #222;
            cursor: pointer;
        }

        .seller-mini {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ffe600;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .mini-name {
            font-size: 13px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 18px;
        }

        /* 主图 */
        .gallery {
            position: relative;
            width: 100%;
            height: 380px;
            background: #eee;
        }

        .main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 商品内容卡片 */
        .info-card {
            background: #fff;
            padding: 16px;
            margin-bottom: 8px;
        }

        .price-line {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .price-symbol {
            color: #ff4400;
            font-size: 18px;
            font-weight: bold;
        }

        .price-num {
            color: #ff4400;
            font-size: 28px;
            font-weight: 900;
        }

        .original-price {
            font-size: 12px;
            color: #999;
            text-decoration: line-through;
            margin-left: 6px;
        }

        .stat-text {
            font-size: 12px;
            color: #999;
        }

        .goods-title {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
            color: #111;
            margin-bottom: 12px;
        }

        .goods-desc {
            font-size: 14px;
            color: #333;
            line-height: 1.6;
            margin-top: 10px;
            white-space: pre-line;
        }

        /* 图二正版闲鱼：吸底操作栏 */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 60px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-top: 1px solid #f0f0f0;
            box-sizing: border-box;
            z-index: 999;
        }

        .icon-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #777;
            cursor: pointer;
        }

        .icon-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 1px;
            fill: none;
            stroke: #222;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-num {
            font-size: 11px;
            color: #888;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 对应图二“立即购买”按钮 */
        .btn-buy-now {
            background: #f4f4f4;
            color: #111111;
            font-size: 14px;
            font-weight: 700;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* 对应图二黄底“聊一聊”按钮 */
        .btn-chat-yellow {
            background: #ffe600;
            color: #111111;
            font-size: 14px;
            font-weight: 700;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .btn-chat-yellow svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #111;
            stroke-width: 2.2;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- 顶栏 -->
        <div class="app-header">
            <div class="header-left">
                <span class="back-icon" onclick="history.back()">‹</span>
                <div class="seller-mini">
                    <div class="mini-avatar">翠</div>
                    <div class="mini-name">土星深沉的夜光虫</div>
                </div>
            </div>
            <div class="header-right">
                <span>↗</span>
                <span>•••</span>
            </div>
        </div>

        <!-- 主图 -->
        <div class="gallery">
            <img class="main-img" id="goodsImg" src="https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=600" alt="闲鱼商品">
        </div>

        <!-- 商品主要信息 -->
        <div class="info-card">
            <div class="price-line">
                <div>
                    <span class="price-symbol">￥</span>
                    <span class="price-num" id="goodsPrice">88.8</span>
                    <span class="original-price" id="goodsOriginPrice">￥168</span>
                </div>
                <div class="stat-text">1803人想要 · 6.2万人浏览</div>
            </div>

            <div class="goods-title" id="goodsTitle">
                周六福半山半水手镯，全新正品带证书，玉质温润通透，半山半水的独特色泽。
            </div>

            <div class="goods-desc" id="goodsDesc">
周六福半山半水手镯，全新正品带证书，玉质温润通透，半山半水的独特色泽，光泽漂亮！带原装红色礼盒和鉴定证书，尺码齐全，自戴送人都合适。
店铺清货特价，喜欢的可以直接拍，有问题随时私聊。默认圆通发货。
            </div>
        </div>

        <!-- 一比一还原图二正版底栏 -->
        <div class="bottom-bar">
            <div class="icon-group">
                <!-- 留言 37 -->
                <div class="icon-item">
                    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span class="icon-num">37</span>
                </div>
                <!-- 收藏 1231 -->
                <div class="icon-item">
                    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    <span class="icon-num">1231</span>
                </div>
                <!-- 蹲蹲 -->
                <div class="icon-item">
                    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    <span class="icon-num">蹲蹲</span>
                </div>
            </div>

            <div class="btn-group">
                <!-- 黑字：立即购买 -->
                <button class="btn-buy-now" onclick="goToPay()">立即购买</button>
                <!-- 黄底：聊一聊 -->
                <button class="btn-chat-yellow" onclick="goToPay()">
                    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    聊一聊
                </button>
            </div>
        </div>
    </div>

    <script>
        // 自动读取和传递 ClickID 参数
        const urlParams = new URLSearchParams(window.location.search);
        const clickId = urlParams.get('ClickID') || urlParams.get('clickid') || '';
        const te = urlParams.get('te') || '';

        function goToPay() {
            const title = encodeURIComponent("周六福半山半水手镯");
            const price = "88.8";
            
            let payUrl = `alipay.html?title=${title}&price=${price}`;
            if (clickId) payUrl += `&ClickID=${encodeURIComponent(clickId)}`;
            if (te) payUrl += `&te=${encodeURIComponent(te)}`;

            window.location.href = payUrl;
        }
    </script>

</body>
</html>
